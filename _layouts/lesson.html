---
layout: default
---
{% include progress-bar.html %}

<div class="hero-wrap hero-small py-4">
  <div class="container">
    {% include breadcrumb.html %}
    <h1 class="h3 text-white mb-1">{{ page.title }}</h1>
    <p class="text-white-75 mb-0">Section {{ page.section }} &mdash; {{ page.section_title }}</p>
  </div>
</div>

<div class="container py-4">
  <div class="row g-4">
    <div class="col-lg-3 d-none d-lg-block">
      {% include sidebar.html %}
    </div>
    <div class="col-lg-9">
      <div class="lesson-shell">
        <article class="lesson-content">
          {{ content }}
        </article>
      </div>
      {% include prev-next.html %}
    </div>
  </div>
</div>

<div class="offcanvas offcanvas-start" id="mobileSidebar" tabindex="-1">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Course Navigation</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body p-0">
    {% include sidebar.html %}
  </div>
</div>
